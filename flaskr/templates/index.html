<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoolRoute - Heat-Aware Navigation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 6px 15px rgba(0,0,0,0.1); width: 420px; margin-bottom: 20px; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        label { font-weight: 600; display: block; margin-top: 12px; color: #34495e; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: #e67e22; color: white; border: none; padding: 12px; margin-top: 22px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #d35400; }
        .map-box { width: 90%; max-width: 1000px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0px 6px 15px rgba(0,0,0,0.1); text-align: center; }
        iframe { width: 100%; height: 550px; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>☀️ CoolRoute Navigation</h2>
        <form action="/generate-route" method="POST">
            <label>Start Latitude:</label>
            <input type="text" name="start_lat" value="20.273824" required>
            
            <label>Start Longitude:</label>
            <input type="text" name="start_lon" value="85.776182" required>
            
            <label>End Latitude:</label>
            <input type="text" name="end_lat" value="20.275463" required>
            
            <label>End Longitude:</label>
            <input type="text" name="end_lon" value="85.777021" required>
            
            <button type="submit">Compute Coolest Route</button>
        </form>
    </div>

    {% if map_generated %}
    <div class="map-box">
        <h3>Interactive Route Comparison Map</h3>
        <iframe src="{{ url_for('static_map') }}"></iframe>
    </div>
    {% endif %}

</body>
</html>
